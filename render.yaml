# Blueprint de deploy no Render (Docker + Postgres gerenciado).
# O Render injeta a env PORT automaticamente; o app a lê.
services:
  - type: web
    name: paxlab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PAXLAB_SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: paxlab-db
          property: connectionString

databases:
  - name: paxlab-db
    plan: free
